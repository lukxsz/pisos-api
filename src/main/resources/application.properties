spring.application.name=pisos-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pisosdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:123}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

app.whatsapp.numero=${WHATSAPP_NUMERO:5511999999999}
api.security.token.secret=${JWT_SECRET:segredo-segredao-pisos-api}
api.security.admin.login=${ADMIN_LOGIN:admin}
api.security.admin.senha=${ADMIN_SENHA:123456}